<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111">
<title>Visual Slash</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><link rel="stylesheet" href="style.css?v=0.7.1">
</head>
<body>
<header><div><div class="brand">/ VISUAL SLASH</div><div class="tag" id="tagline"></div></div><button id="langBtn" class="lang-btn" aria-label="Language">🌐</button></header>
<main>
<section class="hero"><h1><span id="hero1"></span><br><span id="hero2"></span></h1><p id="heroP"></p></section>
<section class="ai-guide"><span class="eyebrow" id="before"></span><h2 id="guideTitle"></h2><p class="lead" id="guideLead"></p><div class="ai-steps"><div class="ai-step"></div><div class="ai-step"></div><div class="ai-step"></div><div class="ai-step"></div></div><small class="ai-note" id="note"></small></section>
<section class="start"><div class="start-head"><div><span class="eyebrow" id="startLabel"></span><h2 id="whatTitle"></h2><p id="whatSub"></p></div></div><div id="modeGrid" class="recipe-grid"></div><div id="modeInfo" class="mode-info"></div><div id="recipeGrid" class="recipe-grid"></div><div class="advisor"><div><strong id="dontKnow"></strong><p id="advisorText"></p></div><button id="helpChoose"></button><small id="advisorMsg"></small></div></section>
<section id="builder"></section>
<section class="subject"><label id="subjectLabel" for="subject"></label><textarea id="subject"></textarea></section>
<section id="whyBox" class="why-box"></section>
<section class="output"><div class="output-head"><span id="slashTitle"></span><button id="copySlash"></button></div><code id="slashLine"></code><div class="output-head prompt-head"><span id="promptTitle"></span><button id="copyPrompt"></button></div><div id="promptText"></div></section>
<section class="actions"><button id="share"></button><button id="reset" class="ghost"></button><button id="install" class="ghost" hidden></button></section>
<section class="about"><h2 id="aboutTitle"></h2><p id="aboutText"></p></section>
</main>
<footer id="footer"></footer>
<div id="languageModal" class="language-modal" hidden>
  <div class="language-card" role="dialog" aria-modal="true" aria-labelledby="languageTitle">
    <button id="languageClose" class="language-close" aria-label="Close">×</button>
    <div class="language-brand">/ VISUAL SLASH</div>
    <h2 id="languageTitle">Choose your language · Scegli la lingua · Sprache wählen</h2>
    <p>Elige tu idioma · Choisissez votre langue · Escolha o idioma · 选择语言</p>
    <small id="langDetected"></small>
    <div class="language-grid">
      <button class="lang-choice" data-lang="it"><b>Italiano</b><span>Continua in italiano</span></button>
      <button class="lang-choice" data-lang="en"><b>English</b><span>Continue in English</span></button>
      <button class="lang-choice" data-lang="de"><b>Deutsch</b><span>Auf Deutsch fortfahren</span></button>
      <button class="lang-choice" data-lang="es"><b>Español</b><span>Continuar en español</span></button>
      <button class="lang-choice" data-lang="fr"><b>Français</b><span>Continuer en français</span></button>
      <button class="lang-choice" data-lang="pt"><b>Português</b><span>Continuar em português</span></button>
      <button class="lang-choice" data-lang="zh-CN"><b>简体中文</b><span>使用简体中文</span></button>
    </div>
    <p class="language-privacy">🌐 Language is saved only on this device · La lingua resta salvata solo su questo dispositivo</p>
  </div>
</div>
<script src="app.js?v=0.7.1"></script>
</body></html>
